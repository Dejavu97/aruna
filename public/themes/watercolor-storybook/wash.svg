<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" fill="none">
  <defs>
    <filter id="blur"><feGaussianBlur stdDeviation="26"/></filter>
    <filter id="edge" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.009" numOctaves="4" seed="12" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="42"/>
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <radialGradient id="r"><stop stop-color="#D9A8A2" stop-opacity=".42"/><stop offset="1" stop-color="#D9A8A2" stop-opacity="0"/></radialGradient>
    <radialGradient id="s"><stop stop-color="#A9B9A2" stop-opacity=".43"/><stop offset="1" stop-color="#A9B9A2" stop-opacity="0"/></radialGradient>
    <radialGradient id="b"><stop stop-color="#BFD1D9" stop-opacity=".4"/><stop offset="1" stop-color="#BFD1D9" stop-opacity="0"/></radialGradient>
  </defs>
  <g filter="url(#edge)">
    <ellipse cx="190" cy="180" rx="350" ry="280" fill="url(#r)"/>
    <ellipse cx="1320" cy="310" rx="390" ry="310" fill="url(#b)"/>
    <ellipse cx="1150" cy="980" rx="430" ry="340" fill="url(#s)"/>
    <ellipse cx="390" cy="980" rx="360" ry="290" fill="url(#r)" opacity=".65"/>
    <ellipse cx="760" cy="610" rx="280" ry="170" fill="url(#s)" opacity=".42"/>
  </g>
  <g opacity=".12" filter="url(#blur)">
    <path d="M-60 820C250 690 420 760 650 840S1120 910 1660 720" stroke="#8A9C84" stroke-width="80"/>
  </g>
</svg>
